[package]
name = "neon-fox-relay"
version = "0.1.0"
edition = "2021"
description = "High-performance Nostr relay server (NIP-01, NIP-16, NIP-33)"

[[bin]]
name = "neon-fox-relay"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework with WebSocket support
axum = { version = "0.7", features = ["ws"] }

# PostgreSQL async ORM
sqlx = { version = "0.7", features = [
    "postgres",
    "runtime-tokio-rustls",
    "json",
    "chrono",
    "macros",
] }

# Redis async client
redis = { version = "0.24", features = [
    "aio",
    "tokio-comp",
    "connection-manager",
    "streams",
] }

# Schnorr signature verification (NIP-01)
secp256k1 = { version = "0.28", features = ["std"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Cryptographic hashing (event ID = SHA256)
sha2 = "0.10"
hex = "0.4"

# Error handling
anyhow = "1"
thiserror = "1"

# Async stream utilities
futures-util = "0.3"

# HTTP middleware (CORS, tracing)
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Environment variable config
dotenvy = "0.15"

# Timestamps
chrono = { version = "0.4", features = ["serde"] }
